@for (item of items; track $index) {

    <p [style.background]="$even ? 'lightblue' : 'lightgreen'">{{item}}</p>
}


@for (num of numbers; track $index) {
    <div>
        <strong>{{num}}</strong>

        <span>| index: {{ $index }}</span>
        <span>| count: {{ $count }}</span>
        <span>| first: {{ $first }}</span>
        <span>| last: {{ $last }}</span> 
        <span>| even: {{ $even }}</span>    
        <span>| odd: {{ $odd }}</span>
    </div>
}
