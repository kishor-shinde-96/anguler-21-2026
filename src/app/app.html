<h2>Signal-driven forms</h2>

<form [formGroup]="form">
  <input formControlName="name" placeholder="Enter your name">
  <br><br>
  <input formControlName="email" placeholder="Enter your email">
  <br><br>
</form>
<button (click)="form.value.name.set('')">Reset</button>
<br><br>
<p> Signal Vake</p>

<pre style="font-size: 20px;">{{userSignal() | json}}</pre>
